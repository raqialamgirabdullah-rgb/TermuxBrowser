name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK
        shell: bash
        run: |
          VC=$((100 + ${{ github.run_number }}))
          echo "VC=$VC" >> "$GITHUB_ENV"
          gradle --no-daemon --stacktrace -Pvc=$VC assembleRelease 2>&1 | tee build.log
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk TermuxBrowser.apk
          gh release create "v0.1.$VC" TermuxBrowser.apk --title "Termux Browser v0.1.$VC" --notes "TermuxBrowser.apk ডাউনলোড করে ইনস্টল করুন।" --latest
      - name: Save build error log (branch build-logs)
        if: failure()
        shell: bash
        run: |
          (grep -E "^e: |error:|Unresolved|mismatch" build.log | head -40; echo "---- tail ----"; tail -n 40 build.log) > /tmp/build-error.log 2>/dev/null || echo "no build log" > /tmp/build-error.log
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan build-logs
          git rm -rf . -q
          cp /tmp/build-error.log build-error.log
          git add build-error.log
          git commit -q -m "build log run ${{ github.run_number }}"
          git push -f origin build-logs
